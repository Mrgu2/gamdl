name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
      - "Apple Music Downloader Windows.spec"
      - "gamdl/**"
      - "pyproject.toml"
      - "tests/**"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --extra desktop-build

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version | Select-Object -First 1

      - name: Run desktop tests
        run: uv run python -m unittest discover -s tests

      - name: Bundle ffmpeg.exe for Windows package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/windows | Out-Null
          $ffmpeg = Get-ChildItem 'C:\ProgramData\chocolatey\lib\ffmpeg\tools' -Filter ffmpeg.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $ffmpeg) { throw 'Unable to locate real ffmpeg.exe after Chocolatey install.' }
          Copy-Item $ffmpeg assets/windows/ffmpeg.exe -Force

      - name: Build Windows launcher
        run: uv run pyinstaller --noconfirm "Apple Music Downloader Windows.spec"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-downloader-windows
          path: dist/Apple Music Downloader Windows
