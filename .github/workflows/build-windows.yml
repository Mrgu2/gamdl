name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
      - "Apple Music Downloader Windows.spec"
      - "gamdl/**"
      - "pyproject.toml"
      - "tests/**"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync dependencies
        run: uv sync --extra desktop-build

      - name: Run desktop tests
        run: uv run python -m unittest discover -s tests

      - name: Build Windows launcher
        run: uv run pyinstaller --noconfirm "Apple Music Downloader Windows.spec"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-music-downloader-windows
          path: dist/Apple Music Downloader Windows
